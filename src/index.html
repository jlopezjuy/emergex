<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!--
    CSP local/prod:
    - En local necesitamos permitir API/JWT en localhost:8080, si no el navegador bloquea /api/authenticate
      antes de salir por red (error de connect-src en consola).
    - En producción conviene inyectar CSP desde Nginx por ambiente para no mezclar orígenes locales.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.cartocdn.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; connect-src 'self' http://localhost:8080 ws://localhost:8080 https://localhost:8080 wss://localhost:8080 https://aliviar.appcanvas.store wss://aliviar.appcanvas.store https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://router.project-osrm.org; frame-src 'self'; base-uri 'self'; form-action 'self';">
  <!-- Apply the saved theme (ThemeService key) before first paint to avoid a dark flash in day mode. -->
  <script>
    try {
      var savedTheme = localStorage.getItem('emergex_theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) { /* storage blocked: keep the default dark theme */ }
  </script>

  -->
