<div class="qc-overlay" (click)="onClose()">
  <div class="qc-modal max-w-sm glass-strong" (click)="$event.stopPropagation()">
    <div class="qc-head border-slate-200 bg-slate-50/50">
      <div>
        <div class="eyebrow" style="color:var(--accent-emerald)">● COBROS Y CAJA</div>
        <h2 style="margin:4px 0 0;font-size:16px;font-weight:600;letter-spacing:-0.01em">
          Registrar pago
        </h2>
      </div>
      <button class="qc-close-btn border-slate-200" (click)="onClose()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="qc-body flex flex-col gap-4 p-5">
      @if (suggestedAmount() === 0) {
        <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-[11px] font-medium leading-normal flex items-start gap-2 shadow-xs animate-in fade-in duration-200">
          <svg class="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <div>
            <strong>Atención:</strong> Este afiliado no posee facturas pendientes. Si confirma este cobro, el sistema <strong>generará la factura de este mes de forma automática</strong> y registrará su pago inmediatamente.
          </div>
        </div>
      }

      <div class="qc-field">
        <label class="eyebrow">Afiliado</label>
        <div class="text-xs font-bold text-slate-800 bg-slate-50 p-2.5 border border-slate-200 rounded-xl font-mono leading-none">
          {{ patient().name }} ({{ patient().id }})
        </div>
      </div>

      <div class="qc-field">
        <label class="eyebrow">Monto de cobro <span style="color:var(--accent-red)">*</span></label>
        <div class="relative w-full">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center font-bold text-slate-400 font-mono text-xs">$</span>
          <input class="qc-input pl-6 font-mono font-semibold" type="number" [(ngModel)]="paymentAmount"/>
        </div>
      </div>

      <div class="qc-field">
        <label class="eyebrow">Método de pago <span style="color:var(--accent-red)">*</span></label>
        <select class="qc-input" [(ngModel)]="paymentMethod">
          @for (m of metodosPago; track m.value) {
            <option [value]="m.value">{{ m.label }}</option>
          }
        </select>
      </div>

      <div class="qc-field">
        <label class="eyebrow">Referencia / Comprobante</label>
        <input class="qc-input font-mono text-xs" placeholder="Ej. TRANS-4992120" [(ngModel)]="paymentRef"/>
      </div>
    </div>

    <div class="qc-foot border-slate-200 bg-slate-50/50">
      <button class="px-4 py-2 border border-slate-200 text-xs font-semibold text-slate-600 bg-white hover:bg-slate-100 rounded-xl transition" (click)="onClose()">Cancelar</button>
      <button class="px-4 py-2 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl transition flex items-center gap-1.5" [disabled]="paymentAmount <= 0" (click)="onSubmit()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        {{ suggestedAmount() === 0 ? 'Generar factura y cobrar' : 'Confirmar cobro' }}
      </button>
    </div>
  </div>
</div>
