<div class="glass p-4 rounded-card flex flex-col md:flex-row gap-4 items-end justify-between w-full shadow-lg border border-glass filter-panel">
  <div class="flex flex-wrap gap-4 items-center flex-1 w-full">
    
    <!-- Professional Selector -->
    <div class="flex flex-col gap-1 min-w-[200px] flex-1">
      <label class="eyebrow eyebrow-lbl">Profesional</label>
      <div class="relative select-wrapper">
        <select 
          [ngModel]="selectedProfessionalId()" 
          (ngModelChange)="setProfessional($event)"
          class="filter-select w-full text-secondary rounded-btn bg-elevated border-glass font-sans text-xs p-2 outline-none cursor-pointer">
          <option [value]="null">Todos los profesionales</option>
          @for (prof of professionals(); track prof.id) {
            <option [value]="prof.id">{{ prof.name }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Specialty Selector -->
    <div class="flex flex-col gap-1 min-w-[180px] flex-1">
      <label class="eyebrow eyebrow-lbl">Especialidad</label>
      <div class="relative select-wrapper">
        <select 
          [ngModel]="selectedSpecialtyId()" 
          (ngModelChange)="setSpecialty($event)"
          class="filter-select w-full text-secondary rounded-btn bg-elevated border-glass font-sans text-xs p-2 outline-none cursor-pointer">
          <option [value]="null">Todas las especialidades</option>
          @for (spec of specialties(); track spec.id) {
            <option [value]="spec.id">{{ spec.name }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Date Picker -->
    <div class="flex flex-col gap-1 min-w-[150px]">
      <label class="eyebrow eyebrow-lbl">Fecha</label>
      <input 
        type="date"
        [ngModel]="selectedDate()" 
        (ngModelChange)="setDate($event)"
        class="filter-input w-full text-secondary rounded-btn bg-elevated border-glass font-sans text-xs p-2 outline-none cursor-pointer" />
    </div>

    <!-- Status Selector -->
    <div class="flex flex-col gap-1 min-w-[150px]">
      <label class="eyebrow eyebrow-lbl">Estado</label>
      <div class="relative select-wrapper">
        <select 
          [ngModel]="selectedStatus()" 
          (ngModelChange)="setStatus($event)"
          class="filter-select w-full text-secondary rounded-btn bg-elevated border-glass font-sans text-xs p-2 outline-none cursor-pointer">
          <option [value]="null">Todos los estados</option>
          @for (status of statuses(); track status.value) {
            <option [value]="status.value">{{ status.label }}</option>
          }
        </select>
      </div>
    </div>

  </div>

  <!-- Actions -->
  <div class="flex gap-2 flex-shrink-0 w-full md:w-auto justify-end">
    <button 
      type="button" 
      class="btn btn--ghost btn--sm rounded-btn"
      [disabled]="!selectedProfessionalId() && !selectedSpecialtyId() && !selectedDate() && !selectedStatus()"
      (click)="clearFilters()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="inline mr-1">
        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
      </svg>
      Limpiar
    </button>
  </div>
</div>
