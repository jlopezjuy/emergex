stages:
  - sync

sync_to_github:
  stage: sync
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/jlopezjuy/emergex.git || git remote set-url github https://x-access-token:${GITHUB_TOKEN}@github.com/jlopezjuy/emergex.git
    - git push --prune github +refs/remotes/origin/*:refs/heads/* +refs/tags/*:refs/tags/*
