server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — fix del 404 en refresh de rutas Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache inmutable para assets hasheados por Angular (js, css, fuentes, imágenes)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca debe cachearse para que el browser siempre tenga la versión más reciente
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
